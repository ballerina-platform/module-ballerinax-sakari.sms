      schema:
        type: string
    autoresponderIdPath:
      name: autoresponderId
      in: path
      description: Autoresponder to apply operations to
      required: true
      schema:
        type: string
    linkIdPath:
      name: linkId
      in: path
      description: ID of link
      required: true
      schema:
        type: string
    dripCampaignIdPath:
      name: dripCampaignId
      in: path
      description: Drip Campaign to apply operations to
      required: true
      schema:
        type: string
    offset:
      name: offset
      in: query
      description: Results to skip when paginating through a result set
      required: false
      schema:
        type: integer
        format: int64
        minimum: 0
    limit:
      name: limit
      in: query
      description: Maximum number of results to return
      required: false
      schema:
        type: integer
        format: int64
        minimum: 1
        maximum: 100
    contactId:
      name: contactId
      in: query
      description: ID of contact
      required: false
      schema:
        type: string
    firstName:
      name: firstName
      in: query
      description: Filter by first name or part of
      required: false
      schema:
        type: string
    lastName:
      name: lastName
      in: query
      description: Filter by last name or part of
      required: false
      schema:
        type: string
    name:
      name: name
      in: query
      description: Filter by name or part of
      required: false
      schema:
        type: string
    mobile:
      name: mobile
      in: query
      description: Filter by mobile or part of
      required: false
      schema:
        type: string
    email:
      name: email
      in: query
      description: Filter by email or part of
      required: false
      schema:
        type: string
    tags:
      name: tags
      in: query
      description: Filter by tag(s)
      required: false
      schema:
        type: string
    conversationId:
      name: conversationId
      in: query
      description: ID of conversation
      required: false
      schema:
        type: string
    country:
