      - type: object
        properties:
          data:
            $ref: "#/components/schemas/Autoresponder"
    WorkflowResponse:
      description: Response containing a single workflow.
      allOf:
      - $ref: "#/components/schemas/BasicResponse"
      - required:
        - data
        type: object
        properties:
          data:
            $ref: "#/components/schemas/Workflow"
    LinkSourcesResponse:
      required:
      - data
      description: Paginated response containing the click sources of a tracked link.
      allOf:
      - $ref: "#/components/schemas/PaginatedResponse"
      - type: object
        properties:
          data:
            type: array
            description: The link sources in this page of results.
            items:
              $ref: "#/components/schemas/LinkSource"
