openapi: 3.0.3
info:
  title: Sakari
  description: "Sakari is a business messaging platform for sending and tracking SMS\
    \ and MMS at scale. This connector manages contacts, messages, conversations,\
    \ templates, campaigns, drip campaigns, autoresponders, tracked links and webhooks\
    \ in a Sakari account."
  termsOfService: https://sakari.io/terms-service.html
  contact:
    email: help@sakari.io
  version: 1.0.2
externalDocs:
  description: Find out more about Sakari
  url: https://sakari.io
servers:
- url: https://api.sakari.io
  description: Sakari Production
tags:
- name: accounts
  description: "Create, modify or delete accounts"
- name: contacts
  description: "Create, modify or delete contacts"
- name: autoresponders
  description: "Create, modify, or delete autoresponders"
- name: availablephonenumbers
  description: Check for available phone numbers
- name: messages
  description: "Send or track messages to one contact, a group of contacts or your\
    \ entire address book"
- name: templates
  description: Define reusable message or web templates
- name: campaigns
  description: "Define reusable message campaigns with a predefined contact list/filter,\
    \ template and schedule"
- name: conversations
  description: Conversations group your message history with each contact into one
    thread
- name: tools
  description: "Tools to assist with sending and receiving messages, such as file\
    \ sharing, translation, etc."
- name: webhooks
  description: "Webhooks allow your own system to be automatically notified upon certin\
    \ events, such as a new message received from one of your contacts or a status\
    \ change notification for your messages"
paths:
  /v1/accounts/{accountId}/balance:
    get:
      tags:
      - accounts
      summary: Fetch account balance
      description: Retrieves the current balance of the account.
      operationId: balance.fetch
      parameters:
      - $ref: "#/components/parameters/accountIdPath"
      responses:
        "200":
          description: The account balance.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BalanceResponse"
        "4XX":
          $ref: "#/components/responses/4XX"
        "5XX":
          $ref: "#/components/responses/5XX"
      security:
      - sakari_auth: []
  /v1/accounts/{accountId}/autoresponders:
    get:
      tags:
      - autoresponders
      summary: Fetch All Account Autoresponders
      description: Lists the autoresponders configured for the account.
      operationId: accounts.autoresponders.fetchAll
      parameters:
      - $ref: "#/components/parameters/accountIdPath"
      responses:
        "200":
          description: The account's autoresponders.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutorespondersResponse"
        "4XX":
          $ref: "#/components/responses/4XX"
        "5XX":
          $ref: "#/components/responses/5XX"
      security:
      - sakari_auth: []
    post:
      tags:
      - autoresponders
      summary: Create an Autoresponder
      description: Creates an autoresponder that replies automatically to matching
        incoming messages.
      operationId: accounts.autoresponders.create
      parameters:
      - $ref: "#/components/parameters/accountIdPath"
      requestBody:
        description: Autoresponder to create.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Autoresponder"
        required: true
      responses:
        "200":
          description: The created autoresponder.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutoresponderResponse"
        "4XX":
          $ref: "#/components/responses/4XX"
        "5XX":
          $ref: "#/components/responses/5XX"
      security:
      - sakari_auth: []
  /v1/accounts/{accountId}/autoresponders/{autoresponderId}:
    get:
      tags:
      - autoresponders
      summary: Fetch An Account Autoresponder
      description: Retrieves an autoresponder by its ID.
      operationId: accounts.autoresponders.fetch
      parameters:
      - $ref: "#/components/parameters/accountIdPath"
      - $ref: "#/components/parameters/autoresponderIdPath"
      responses:
        "200":
          description: The requested autoresponder.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutoresponderResponse"
        "4XX":
          $ref: "#/components/responses/4XX"
        "5XX":
          $ref: "#/components/responses/5XX"
      security:
      - sakari_auth: []
    put:
      tags:
      - autoresponders
      summary: Update An Autoresponder
      description: Updates an existing autoresponder.
      operationId: accounts.autoresponders.update
      parameters:
      - $ref: "#/components/parameters/accountIdPath"
      - $ref: "#/components/parameters/autoresponderIdPath"
      requestBody:
        description: Autoresponder fields to update.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Autoresponder"
        required: true
      responses:
        "200":
          description: The updated autoresponder.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutoresponderResponse"
        "4XX":
          $ref: "#/components/responses/4XX"
        "5XX":
          $ref: "#/components/responses/5XX"
      security:
      - sakari_auth: []
    delete:
      tags:
      - autoresponders
      summary: Remove an autoresponder
      description: Removes an autoresponder from the account.
      operationId: accounts.autoresponders.remove
      parameters:
      - $ref: "#/components/parameters/accountIdPath"
      - $ref: "#/components/parameters/autoresponderIdPath"
      responses:
        "200":
          description: Confirmation that the autoresponder was removed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BasicResponse"
        "4XX":
          $ref: "#/components/responses/4XX"
        "5XX":
          $ref: "#/components/responses/5XX"
      security:
      - sakari_auth: []
  /v1/accounts/{accountId}/availablephonenumbers:
    get:
      tags:
      - availablephonenumbers
      summary: Check all available phone numbers
      description: "Searches for phone numbers available to add to the account, filtered\
        \ by country, type, area code and other criteria."
      operationId: accounts.availablephonenumbers
      parameters:
      - $ref: "#/components/parameters/accountIdPath"
      - $ref: "#/components/parameters/country"
      - $ref: "#/components/parameters/type"
      - $ref: "#/components/parameters/postalCode"
      - $ref: "#/components/parameters/features"
      - $ref: "#/components/parameters/contains"
      - $ref: "#/components/parameters/areaCode"
      responses:
        "200":
          description: The phone numbers available to add to the account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AvailablePhoneNumbersResponse"
        "4XX":
          $ref: "#/components/responses/4XX"
        "5XX":
          $ref: "#/components/responses/5XX"
      security:
      - sakari_auth: []
  /v1/accounts/{accountId}/contacts:
    get:
      tags:
      - contacts
      summary: Fetch contacts
      description: "Lists the account's contacts, optionally filtered by name, mobile\
        \ number, email or tags."
      operationId: contacts.fetchAll
      parameters:
      - $ref: "#/components/parameters/accountIdPath"
      - $ref: "#/components/parameters/offset"
      - $ref: "#/components/parameters/limit"
      - $ref: "#/components/parameters/firstName"
      - $ref: "#/components/parameters/lastName"
      - $ref: "#/components/parameters/mobile"
      - $ref: "#/components/parameters/email"
      - $ref: "#/components/parameters/tags"
      responses:
        "200":
          description: A page of contacts matching the filters.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactsResponse"
        "4XX":
          $ref: "#/components/responses/4XX"
        "5XX":
          $ref: "#/components/responses/5XX"
      security:
      - sakari_auth: []
      x-code-samples:
      - lang: CURL
        source: |
          curl -X GET \
            https://api.sakari.io/v1/accounts/{{ACCOUNT_ID}}/contacts \
            -H 'Authorization: Bearer {{TOKEN}}'
      - lang: JavaScript
        source: "var request = require(\"request\");\nvar options = { method: 'GET',\n\
          \  url: 'https://api.sakari.io/v1/accounts/{{ACCOUNT_ID}}/contacts',\n \
          \ headers: \n   { Authorization: 'Bearer {{TOKEN}}' } };\n\nrequest(options,\
          \ function (error, response, body) {\n  if (error) throw new Error(error);\n\
          \n  console.log(body);\n});\n"
      - lang: PHP
        source: "<?php\n  $request = new HttpRequest();\n  $request->setUrl('https://api.sakari.io/v1/accounts/{{ACCOUNT_ID}}/contacts');\n\
          \  $request->setMethod(HTTP_METH_GET);\n  \n  $request->setHeaders(array(\n\
          \    'Authorization' => 'Bearer {{TOKEN}}'\n  ));\n  \n  try {\n    $response\
          \ = $request->send();\n  \n    echo $response->getBody();\n  } catch (HttpException\
          \ $ex) {\n    echo $ex;\n  }\n"
    post:
      tags:
      - contacts
      summary: Create contact
      description: "Creates a contact, or uploads several contacts from a CSV file,\
        \ merging with existing contacts according to the merge strategy."
      operationId: contacts.create
      parameters:
      - $ref: "#/components/parameters/accountIdPath"
      - name: mergeStrategy
        in: query
        description: Determines how existing contacts with matching mobile numbers
          are treated
        required: false
        style: form
        explode: true
        schema:
          type: string
          enum:
          - append
          - core
          - remove
      requestBody:
        description: "Contact to create, as JSON, or a CSV file of contacts to upload."
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Contact"
          text/csv:
            schema:
              type: string
              example: |
                country,firstName,lastName,email,mobile,jobTitle,Address,City,State,ZipCode US,Joe,Bloggs,joebloggs@sakari.co,123-456-7890,mover,123 Text Street,San Francisco,CA,12345
      responses:
        "201":
          description: "The created contacts, or a summary of the uploaded contacts."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateContactResponse"
        "4XX":
          $ref: "#/components/responses/4XX"
        "5XX":
          $ref: "#/components/responses/5XX"
      security:
      - sakari_auth: []
      x-code-samples:
      - lang: CURL
        source: |
          curl -X POST \
            https://api.sakari.io/v1/accounts/{{ACCOUNT_ID}}/contacts \
            -H 'Content-Type: application/json' \
            -d '{
            "firstName": "Chris",
            "lastName": "Thomson",
            "mobile": {
              "number": "+1234567890",
              "country": "US"
            }
          }'
      - lang: JavaScript
        source: "var request = require(\"request\");\nvar options = { method: 'POST',\n\
          \  url: 'https://api.sakari.io/v1/accounts/{{ACCOUNT_ID}}/contacts',\n \
          \ headers: {\n     Authorization: 'Bearer {{TOKEN}}',\n     'Content-Type':\
          \ 'application/json' },\n  body: \n   { firstName: 'Chris',\n     lastName:\
          \ 'Thomson',\n     mobile: { number: '+1234567890', country: 'US' } },\n\
          \  json: true };\n\nrequest(options, function (error, response, body) {\n\
          \  if (error) throw new Error(error);\n\n  console.log(body);\n});\n"
      - lang: PHP
        source: "<?php\n  $request = new HttpRequest();\n  $request->setUrl('https://api.sakari.io/v1/accounts/{{ACCOUNT_ID}}/contacts');\n\
          \  $request->setMethod(HTTP_METH_POST);\n  \n  $request->setHeaders(array(\n\
          \    'Content-Type' => 'application/json'\n  ));\n  \n  $request->setBody('{\n\
          \    \"firstName\": \"Chris\",\n    \"lastName\": \"Thomson\",\n    \"mobile\"\
          : {\n      \"number\": \"+1234567890\",\n      \"country\": \"US\"\n   \
          \ }\n  }');\n  \n  try {\n    $response = $request->send();\n  \n    echo\
          \ $response->getBody();\n  } catch (HttpException $ex) {\n    echo $ex;\n\
          \  }\n"
  /v1/accounts/{accountId}/contacts/{contactId}:
    get:
      tags:
      - contacts
      summary: Fetch contact by ID
      description: Retrieves a contact by its ID.
      operationId: contacts.fetch
      parameters:
      - $ref: "#/components/parameters/accountIdPath"
      - name: contactId
        in: path
        description: ID of contact to return
        required: true
        style: simple
        explode: false
        schema:
          type: string
      responses:
        "200":
          description: The requested contact.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactResponse"
        "4XX":
          $ref: "#/components/responses/4XX"
        "5XX":
          $ref: "#/components/responses/5XX"
      security:
      - sakari_auth: []
      x-code-samples:
      - lang: CURL
        source: |
          curl -X GET \
            https://api.sakari.io/v1/accounts/{{ACCOUNT_ID}}/contacts/{{CONTACT_ID}} \
            -H 'Authorization: Bearer {{TOKEN}}'
      - lang: JavaScript
        source: "var request = require(\"request\");\nvar options = { method: 'GET',\n\
          \  url: 'https://api.sakari.io/v1/accounts/{{ACCOUNT_ID}}/contacts/{{CONTACT_ID}}',\n\
          \  headers: \n   { Authorization: 'Bearer {{TOKEN}}' } };\n\nrequest(options,\
          \ function (error, response, body) {\n  if (error) throw new Error(error);\n\
          \n  console.log(body);\n});\n"
      - lang: PHP
        source: "<?php\n  $request = new HttpRequest();\n  $request->setUrl('https://api.sakari.io/v1/accounts/{{ACCOUNT_ID}}/contacts/{{CONTACT_ID}}');\n\
          \  $request->setMethod(HTTP_METH_GET);\n  \n  $request->setHeaders(array(\n\
          \    'Authorization' => 'Bearer {{TOKEN}}'\n  ));\n  \n  try {\n    $response\
          \ = $request->send();\n  \n    echo $response->getBody();\n  } catch (HttpException\
          \ $ex) {\n    echo $ex;\n  }\n"
    put:
      tags:
      - contacts
      summary: Updates a contact
      description: Updates an existing contact.
      operationId: contacts.update
      parameters:
      - $ref: "#/components/parameters/accountIdPath"
      - name: contactId
        in: path
        description: ID of contact
        required: true
        style: simple
        explode: false
        schema:
          type: string
      requestBody:
        description: Contact fields to update.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Contact"
        required: true
      responses:
        "200":
          description: The updated contact.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactResponse"
        "4XX":
          $ref: "#/components/responses/4XX"
        "5XX":
          $ref: "#/components/responses/5XX"
      security:
      - sakari_auth: []
      x-code-samples:
      - lang: CURL
        source: |
          curl -X PUT \
            https://api.sakari.io/v1/accounts/{{ACCOUNT_ID}}/contacts/{{CONTACT_ID}} \
            -H 'Authorization: Bearer {{TOKEN}}'' \
            -H 'Content-Type: application/json' \
            -d '{
            "firstName": "Bob",
            "lastName": "Thomson",
            "mobile": {
              "number": "+1234567890",
              "country": "US"
            }
          }'
      - lang: JavaScript
        source: "var request = require(\"request\");\nvar options = { method: 'PUT',\n\
          \  url: 'https://api.sakari.io/v1/accounts/{{ACCOUNT_ID}}/contacts/{{CONTACT_ID}}',\n\
          \  headers: \n   { 'Authorization': 'Bearer {{TOKEN}}',\n     'Content-Type':\
          \ 'application/json' },\n  body: \n   { firstName: 'Bob',\n     lastName:\
          \ 'Thomson',\n     mobile: { number: '+1234567890', country: 'US' } },\n\
          \  json: true };\n\nrequest(options, function (error, response, body) {\n\
          \  if (error) throw new Error(error);\n\n  console.log(body);\n});\n"
      - lang: PHP
        source: "<?php\n  $request = new HttpRequest();\n  $request->setUrl('https://api.sakari.io/v1/accounts/{{ACCOUNT_ID}}/contacts/{{CONTACT_ID}}');\n\
          \  $request->setMethod(HTTP_METH_PUT);\n  \n  $request->setHeaders(array(\n\
          \    'Authorization' => 'Bearer {{TOKEN}}',\n    'Content-Type' => 'application/json'\n\
          \  ));\n  \n  $request->setBody('{\n    \"firstName\": \"Bob\",\n    \"\
          lastName\": \"Thomson\",\n    \"mobile\": {\n      \"number\": \"+1234567890\"\
          ,\n      \"country\": \"US\"\n    }\n  }');\n  \n  try {\n    $response\
          \ = $request->send();\n  \n    echo $response->getBody();\n  } catch (HttpException\
          \ $ex) {\n    echo $ex;\n  }\n"
    delete:
      tags:
      - contacts
      summary: Deletes a contact
      description: Deletes a contact from the account.
      operationId: contacts.remove
      parameters:
      - $ref: "#/components/parameters/accountIdPath"
      - name: contactId
        in: path
        description: Contact id to delete
        required: true
        style: simple
        explode: false
        schema:
          type: string
      responses:
        "200":
          description: Confirmation that the contact was deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "4XX":
          $ref: "#/components/responses/4XX"
        "5XX":
          $ref: "#/components/responses/5XX"
      security:
      - sakari_auth: []
      x-code-samples:
      - lang: CURL
        source: |
          curl -X DELETE \
            https://api.sakari.io/v1/accounts/{{ACCOUNT_ID}}/contacts/{{CONTACT_ID}} \
            -H 'Authorization: Bearer {{TOKEN}}' \
            -H 'Content-Type: application/json' \
          }'
      - lang: JavaScript
        source: "var request = require(\"request\");\nvar options = { method: 'DELETE',\n\
          \  url: 'https://api.sakari.io/v1/accounts/{{ACCOUNT_ID}}/contacts/{{CONTACT_ID}}',\n\
          \  headers: \n   { 'Authorization': 'Bearer {{TOKEN}}',\n     'Content-Type':\
          \ 'application/json' } };\n\nrequest(options, function (error, response,\
          \ body) {\n  if (error) throw new Error(error);\n\n  console.log(body);\n\
          });\n"
      - lang: PHP
        source: "<?php\n  $request = new HttpRequest();\n  $request->setUrl('https://api.sakari.io/v1/accounts/{{ACCOUNT_ID}}/contacts/{{CONTACT_ID}}');\n\
          \  $request->setMethod(HTTP_METH_DELETE);\n  \n  $request->setHeaders(array(\n\
          \    'Authorization' => 'Bearer {{TOKEN}}',\n    'Content-Type' => 'application/json'\n\
          \  ));\n  \n  $request->setBody('{\n    \"firstName\": \"Chris\",\n    \"\
          lastName\": \"Thomson\",\n    \"mobile\": {\n      \"number\": \"+1234567890\"\
          ,\n      \"country\": \"US\"\n    }\n  }');\n  \n  try {\n    $response\
          \ = $request->send();\n  \n    echo $response->getBody();\n  } catch (HttpException\
          \ $ex) {\n    echo $ex;\n  }\n"
  /v1/accounts/{accountId}/messages:
    get:
      tags:
      - messages
      summary: Fetch messages
      description: "Lists the account's messages, optionally filtered by contact or\
        \ conversation."
      operationId: messages.fetchAll
      parameters:
      - $ref: "#/components/parameters/accountIdPath"
      - $ref: "#/components/parameters/offset"
      - $ref: "#/components/parameters/limit"
      - $ref: "#/components/parameters/contactId"
      - $ref: "#/components/parameters/conversationId"
      responses:
        "200":
          description: A page of messages matching the filters.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessagesResponse"
        "4XX":
          $ref: "#/components/responses/4XX"
        "5XX":
          $ref: "#/components/responses/5XX"
      security:
      - sakari_auth: []
      x-code-samples:
      - lang: CURL
        source: |
          curl -X GET \
            https://api.sakari.io/v1/accounts/{{ACCOUNT_ID}}/messages \
            -H 'Authorization: Bearer {{TOKEN}}'
      - lang: JavaScript
        source: |
          var settings = {
            "async": true,
            "crossDomain": true,
            "url": "https://api.sakari.io/v1/accounts/{{ACCOUNT_ID}}/messages",
            "method": "GET",
            "headers": {
              "Authorization": "Bearer {{TOKEN}}"
            }
          }

          $.ajax(settings).done(function (response) {
            console.log(response);
          });
      - lang: PHP
        source: "<?php\n  $request = new HttpRequest();\n  $request->setUrl('https://api.sakari.io/v1/accounts/{{ACCOUNT_ID}}/messages');\n\
          \  $request->setMethod(HTTP_METH_GET);\n  \n  $request->setHeaders(array(\n\
          \    'Authorization' => 'Bearer {{TOKEN}}'\n  ));\n  \n  try {\n    $response\
          \ = $request->send();\n  \n    echo $response->getBody();\n  } catch (HttpException\
          \ $ex) {\n    echo $ex;\n  }\n"
    post:
      tags:
      - messages
      summary: Send Messages
      description: "Sends a message to the specified contacts, conversations or contacts\
        \ matching the filters."
      operationId: messages.send
      parameters:
      - $ref: "#/components/parameters/accountIdPath"
      requestBody:
        description: Message to send and the recipients to send it to.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendMessagesRequest"
      responses:
        "200":
          description: A summary of the messages queued for sending.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SendMessagesResponse"
        "4XX":
          $ref: "#/components/responses/4XX"
        "5XX":
          $ref: "#/components/responses/5XX"
      security:
      - sakari_auth: []
      x-code-samples:
      - lang: CURL
        source: |
          curl -X POST \
            https://api.sakari.io/v1/accounts/{{ACCOUNT_ID}}/messages \
            -H 'Accept: application/json' \
            -H 'Authorization: Bearer {{TOKEN}}' \
            -H 'Content-Type: application/json' \
            -d '{
            "contacts": [{
              "mobile": {
                "number": "+1234567890",
                "country": "US"
              }
            }],
            "template": "Congratulations! You just sent your first message"
          } '
      - lang: JavaScript
        source: "var request = require(\"request\");\nvar options = { method: 'POST',\n\
          \  url: 'https://api.sakari.io/v1/accounts/{{ACCOUNT_ID}}/messages',\n \
          \ headers: \n   { 'Authorization': 'Bearer {{TOKEN}}',\n     Accept: 'application/json',\n\
          \     'Content-Type': 'application/json' },\n  body: \n   { contacts: [\
          \ { mobile: { number: '+1234567890', country: 'US' } } ],\n     template:\
          \ 'Congratulations! You just sent your first message' },\n  json: true };\n\
          \nrequest(options, function (error, response, body) {\n  if (error) throw\
          \ new Error(error);\n\n  console.log(body);\n});\n"
      - lang: PHP
        source: "<?php\n  $request = new HttpRequest();\n  $request->setUrl('https://api.sakari.io/v1/accounts/{{ACCOUNT_ID}}/messages');\n\
          \  $request->setMethod(HTTP_METH_POST);\n  \n  $request->setHeaders(array(\n\
          \    'Authorization' => 'Bearer {{TOKEN}}',\n    'Accept' => 'application/json',\n\
          \    'Content-Type' => 'application/json'\n  ));\n  \n  $request->setBody('{\n\
          \    \"contacts\": [{\n      \"mobile\": {\n        \"number\": \"+1234567890\"\
          ,\n        \"country\": \"US\"\n      }\n    }],\n    \"template\": \"Congratulations!\
          \ You just sent your first message\"\n  } ');\n  \n  try {\n    $response\
          \ = $request->send();\n  \n    echo $response->getBody();\n  } catch (HttpException\
          \ $ex) {\n    echo $ex;\n  }\n"
  /v1/accounts/{accountId}/messages/{messageId}:
    get:
      tags:
      - messages
      summary: Fetch message by id
      description: Returns a single message by its ID.
      operationId: messages.fetch
      parameters:
      - $ref: "#/components/parameters/accountIdPath"
      - name: messageId
        in: path
        description: ID of message to return
