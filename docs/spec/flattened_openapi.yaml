      operationId: accounts.dripcampaigns.migrate
      parameters:
      - $ref: "#/components/parameters/accountIdPath"
      - $ref: "#/components/parameters/dripCampaignIdPath"
      responses:
        "200":
          description: The workflow created from the drip campaign.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowResponse"
        "4XX":
          $ref: "#/components/responses/4XX"
        "5XX":
          $ref: "#/components/responses/5XX"
      security:
      - sakari_auth: []
  /v1/accounts/{accountId}/dripcampaigns/{dripCampaignId}/executions:
    get:
      tags:
      - dripcampaigns
      summary: Fetch executions for dripcampaigns
      description: "Lists the contacts' executions of a drip campaign, optionally\
        \ for a specific workflow version."
      operationId: accounts.dripcampaigns.executions
      parameters:
      - $ref: "#/components/parameters/accountIdPath"
      - $ref: "#/components/parameters/dripCampaignIdPath"
      - $ref: "#/components/parameters/versionId"
      - $ref: "#/components/parameters/offset"
      responses:
        "200":
          description: The executions of the drip campaign.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DripCampaignExecutionsResponse"
        "4XX":
          $ref: "#/components/responses/4XX"
        "5XX":
          $ref: "#/components/responses/5XX"
      security:
      - sakari_auth: []
components:
  schemas:
    QuickCampaignResponse:
      required:
      - data
      description: Response containing a newly created campaign and its execution.
      allOf:
      - $ref: "#/components/schemas/BasicResponse"
      - type: object
        properties:
          data:
            type: object
            properties:
              campaign:
                $ref: "#/components/schemas/Campaign"
              job:
                $ref: "#/components/schemas/CampaignExecution"
            description: The created campaign and its execution.
    WorkflowProperty:
      required:
      - dataType
      - name
      type: object
      properties:
        name:
          type: string
          description: Name of the property.
        dataType:
          type: string
          description: Data type of the property.
          enum:
          - string
          - number
          - boolean
          - date
        created:
          $ref: "#/components/schemas/WorkflowPropertyCreated"
      description: A named property that holds a value while a workflow runs.
    DripCampaignExecution:
      required:
      - entered
      - id
      - status
      type: object
      properties:
        id:
          type: string
          description: Unique identifier of the execution.
          readOnly: true
        status:
          type: string
          description: Status of the contact in the drip campaign.
        contact:
          $ref: "#/components/schemas/Contact"
        entered:
          type: string
          description: Date and time the contact entered the drip campaign.
          format: date-time
      description: A contact's progress through a drip campaign.
    LinkSource:
      required:
      - name
      - stats
      type: object
      properties:
        id:
          type: string
          description: Unique identifier of the link source.
          readOnly: true
        name:
          type: string
          description: Name of the link source.
          readOnly: true
        stats:
          $ref: "#/components/schemas/LinkSourceStats"
      description: "A source of clicks on a tracked link, with its click statistics."
    Autoresponder:
      required:
      - id
      - match
      - response
      type: object
      properties:
        id:
          type: string
          description: Unique identifier of the autoresponder.
          readOnly: true
        match:
          type: string
          description: Text or pattern that incoming messages are matched against.
        response:
          type: string
          description: Reply sent when an incoming message matches.
        advanced:
          type: boolean
          description: Whether advanced matching settings are used.
          default: false
        scheduleType:
          type: string
          description: "When the autoresponder is active: out of office, in office\
            \ or on a custom schedule."
          enum:
          - OOO
          - in office
          - custom
        customObject:
          type: object
          description: Custom schedule settings used when the schedule type is custom.
        group:
          type: string
          description: Group whose incoming messages the autoresponder applies to.
      description: A rule that automatically replies to incoming messages matching
        a pattern.
    WorkflowVersion:
      required:
      - created
      - definition
      - id
      - updated
      - version
      type: object
      properties:
        id:
          type: string
          description: Unique identifier of the version.
        name:
          type: string
          description: Name of the version.
        definition:
          $ref: "#/components/schemas/WorkflowDefinition"
        readonly:
          type: boolean
          description: Whether the version is read-only.
        active:
          type: string
          description: Date and time the version was activated.
          format: date-time
        lastActive:
          type: string
          description: Date and time the version was last active.
          format: date-time
        created:
          $ref: "#/components/schemas/Updated"
        updated:
          $ref: "#/components/schemas/Updated"
      description: A version of a workflow and its definition.
    WorkflowProperties:
      type: array
      description: Properties declared on a workflow.
      items:
        $ref: "#/components/schemas/WorkflowProperty"
    WorkflowCondition:
      required:
      - attribute
      - comparator
      - value
      type: object
      properties:
        attribute:
          $ref: "#/components/schemas/WorkflowDataReference"
        comparator:
          type: string
          description: Comparison operator to apply.
        value:
          description: Value or values to compare against.
          oneOf:
          - type: array
            items:
              type: string
          - type: array
            items:
              type: number
          - type: string
          - type: number
      description: A comparison applied to a workflow data reference.
    UpdatedBy:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier of the user who made the change.
        name:
          type: string
          description: Full name of the user who made the change.
          example: Joe Bloggs
        firstName:
          type: string
          description: First name of the user who made the change.
          example: Joe
        lastName:
          type: string
          description: Last name of the user who made the change.
          example: Bloggs
        email:
          type: string
          description: Email address of the user who made the change.
          example: joe@bloggs.com
        source:
          type: string
          description: Source through which the change was made.
        subSource:
          type: string
          description: More specific source through which the change was made.
      description: The user or process that made a change to a record.
    PaginatedResponse:
      required:
      - pagination
      description: "Base envelope for list results, adding pagination details to the\
        \ basic response."
      allOf:
      - $ref: "#/components/schemas/BasicResponse"
      - type: object
        properties:
          pagination:
            $ref: "#/components/schemas/Pagination"
    SendMessagesRequest:
      type: object
      properties:
        conversations:
          type: array
          description: List of conversation ids to send messages to
          items:
            type: string
        contacts:
          type: array
          description: Contacts to send the message to.
          items:
            $ref: "#/components/schemas/Contact"
        filters:
          $ref: "#/components/schemas/SendMessagesRequestFilters"
        phoneNumberFilter:
          $ref: "#/components/schemas/SendMessagesRequestPhoneNumberFilter"
        template:
          type: string
          description: "Message text to send, which may include contact attribute\
            \ placeholders."
        type:
          type: string
          description: Type of message to send.
          enum:
          - SMS
          - MMS
        media:
          type: array
          description: List of media objects to attach to message
          items:
            $ref: "#/components/schemas/SendMessagesRequestMedia"
      description: "Request payload for sending a message to contacts, conversations\
        \ or a filtered set of contacts."
    DripCampaignsResponse:
      description: Paginated response containing a list of drip campaigns.
      allOf:
      - $ref: "#/components/schemas/PaginatedResponse"
      - required:
        - data
        type: object
        properties:
          data:
            type: array
            description: The drip campaigns in this page of results.
            items:
              $ref: "#/components/schemas/DripCampaign"
    LinkClickedNodeConfig:
      type: object
      properties:
        link:
          $ref: "#/components/schemas/Link"
        timeout:
          $ref: "#/components/schemas/Delay"
      description: Configuration of a node that waits for a tracked link to be clicked.
    VoiceChannel:
      description: Voice channel settings for a phone number or sender.
      allOf:
      - $ref: "#/components/schemas/Channel"
      - type: object
        properties:
          incoming:
            type: object
            properties:
              action:
                type: string
                description: Action taken for incoming calls.
                enum:
                - forward
                - voicemail
              forwardTo:
                type: string
                description: Phone number incoming calls are forwarded to.
              message:
                type: string
                description: Message played to callers.
              transcribe:
                type: boolean
                description: Whether voicemails are transcribed.
            description: How incoming calls are handled.
          features:
            type: array
            description: Voice features enabled for the channel.
            items:
              type: string
    ContactCreatedTriggerConfig:
      type: object
      description: Configuration of a trigger that starts a workflow when a contact
        is created.
    SendMessageNodeConfigMessage:
      type: object
      properties:
        message:
          type: string
          description: Text of the message.
        media:
          type: array
          description: List of media objects attached to message
          items:
            $ref: "#/components/schemas/Media"
      description: Content of the message.
    CampaignPhoneNumberFilterGroup:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier of the group.
      description: Group whose phone numbers send the campaign.
    DripCampaign:
      required:
      - messages
      - name
      - trigger
      type: object
      properties:
        id:
          type: string
          description: Unique identifier of the drip campaign.
          readOnly: true
        name:
          type: string
          description: Name of the drip campaign.
        description:
          type: string
          description: Description of the drip campaign.
        trigger:
          $ref: "#/components/schemas/DripCampaignTrigger"
        messages:
          type: array
          description: "Messages sent by the drip campaign, in order."
          items:
            $ref: "#/components/schemas/DripCampaignMessage"
        active:
          type: boolean
          description: Whether the drip campaign is active.
          readOnly: true
        maxDuration:
          type: number
          description: Maximum duration of the drip campaign.
          readOnly: true
        stats:
          $ref: "#/components/schemas/DripCampaignStats"
        created:
          $ref: "#/components/schemas/Updated"
        updated:
          $ref: "#/components/schemas/Updated"
      description: A drip campaign that sends a sequence of timed messages to contacts
        after a trigger event.
    DripCampaignMessage:
      required:
      - delay
      - message
      type: object
      properties:
        id:
          type: string
          description: Unique identifier of the drip campaign message.
          readOnly: true
        message:
          type: string
          description: Text of the message.
        media:
          type: array
          description: Media files attached to the message.
          items:
            $ref: "#/components/schemas/Media"
        delay:
          $ref: "#/components/schemas/Delay"
        stats:
          $ref: "#/components/schemas/DripCampaignStats"
      description: "A message sent as one step of a drip campaign, after a delay."
    LinkSourceResponse:
      required:
      - data
      description: Response containing a single click source of a tracked link.
      allOf:
      - $ref: "#/components/schemas/BasicResponse"
      - type: object
        properties:
          data:
            $ref: "#/components/schemas/LinkSource"
    WorkflowNodePropertyBaseObject:
      required:
      - type
      type: object
      properties:
        label:
          type: string
          description: Display label of the property.
        helperText:
          type: string
          description: Help text shown for the property.
        link:
          type: string
          description: URL of further information about the property.
        type:
          $ref: "#/components/schemas/WorkflowNodePropertyType"
        mandatory:
          type: boolean
          description: Whether the property must be set.
        args:
          type: array
          description: Additional arguments for the input control.
          items:
            type: string
        options:
          type: array
          description: Options that can be selected for the property.
          items:
            $ref: "#/components/schemas/SelectOption"
        min:
          type: number
          description: Minimum allowed value.
        max:
          type: number
          description: Maximum allowed value.
        defaultValue:
          description: Default value of the property.
          anyOf:
          - type: string
          - type: boolean
          - type: number
          - type: object
      description: Base settings shared by workflow node properties.
    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          description: Whether the operation succeeded.
      description: Confirmation that the requested operation completed.
    SendMessagesRequestPhoneNumberFilterGroup:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier of the group.
      description: Group whose phone numbers send the message.
    ChoiceNodeConfig:
      required:
      - property
      type: object
      properties:
        property:
          $ref: "#/components/schemas/WorkflowDataReference"
      description: Configuration of a node that branches on the value of a property.
    GroupOfficeHours:
      type: object
      properties:
        active:
          type: boolean
          description: Whether office hours are enabled.
        timezone:
          type: string
          description: Time zone of the office hours.
        times:
          $ref: "#/components/schemas/Times"
      description: Office hours configured for a group.
    CampaignResponse:
      required:
      - data
      description: Response containing a single campaign.
      allOf:
      - $ref: "#/components/schemas/BasicResponse"
      - type: object
        properties:
          data:
            $ref: "#/components/schemas/Campaign"
    Workflow:
      required:
      - account
      - created
      - id
      - name
      - updated
      type: object
      properties:
        id:
          type: string
          description: Unique identifier of the workflow.
          readOnly: true
        name:
          type: string
          description: Name of the workflow.
        versions:
          type: array
          description: Versions of the workflow.
          items:
            $ref: "#/components/schemas/WorkflowVersion"
        created:
          $ref: "#/components/schemas/Updated"
        updated:
          $ref: "#/components/schemas/Updated"
      description: An automated workflow and its versions.
    WebhookResponse:
      required:
      - data
      description: Response containing a single webhook subscription.
      allOf:
      - $ref: "#/components/schemas/BasicResponse"
      - type: object
        properties:
          data:
            $ref: "#/components/schemas/Webhook"
    MessageReceivedNodeConfig:
      type: object
      properties:
        group:
          $ref: "#/components/schemas/Group"
        timeout:
          $ref: "#/components/schemas/Delay"
      description: Configuration of a node that waits for a reply message.
    WebhooksResponse:
      required:
      - data
      description: Paginated response containing a list of webhook subscriptions.
      allOf:
      - $ref: "#/components/schemas/PaginatedResponse"
      - type: object
        properties:
          data:
            type: array
            description: The webhook subscriptions in this page of results.
            items:
              $ref: "#/components/schemas/Webhook"
    GoogleSheetTab:
      type: object
      properties:
        id:
          type: number
          description: Unique identifier of the tab.
        name:
          type: string
          description: Name of the tab.
      description: A tab in a Google Sheets spreadsheet.
    Sender:
      required:
      - created
      - id
      - identifier
      - status
      - subType
      - type
      - updated
      type: object
      properties:
        id:
          type: string
          description: Unique identifier of the sender.
        type:
          type: string
          description: Type of the sender.
          enum:
          - phonenumber
        subType:
          type: string
          description: Subtype of the sender.
        status:
          type: string
          description: Status of the sender.
        identifier:
          type: string
          description: "Identifier of the sender, such as the phone number."
        channels:
          $ref: "#/components/schemas/PhoneNumberChannels"
        groups:
          type: array
          description: Groups the sender is assigned to.
          items:
            $ref: "#/components/schemas/BasicGroup"
        created:
          $ref: "#/components/schemas/Updated"
        updated:
          $ref: "#/components/schemas/Updated"
      description: "A sender identity, such as a phone number, used to send messages."
    SendMessagesResponse:
      required:
      - data
      description: Response summarising a request to send messages.
      allOf:
      - $ref: "#/components/schemas/BasicResponse"
      - type: object
        properties:
          data:
            type: object
            properties:
              messages:
                type: array
                description: Messages created by the request.
                items:
                  $ref: "#/components/schemas/Message"
              jobId:
                type: string
                description: ID of the job that sends the messages.
              requested:
                type: integer
                description: Number of recipients requested.
              valid:
                type: integer
                description: Number of valid recipients.
              invalid:
                type: array
                description: Contacts that could not be sent to.
                items:
                  $ref: "#/components/schemas/Contact"
              estimatedPrice:
                type: number
                description: Estimated total price of the messages.
                format: double
            description: Summary of the send request.
    WorkflowPropertyCreated:
      type: object
      properties:
        at:
          type: string
          description: Date and time the property was created.
          format: date-time
      description: When the property was created.
    CampaignsResponse:
      required:
      - data
      description: Paginated response containing a list of campaigns.
      allOf:
      - $ref: "#/components/schemas/PaginatedResponse"
      - type: object
        properties:
          data:
            type: array
            description: The campaigns in this page of results.
            items:
              $ref: "#/components/schemas/Campaign"
    ListSource:
      required:
      - id
      - integration
      type: object
      properties:
        id:
          type: string
          description: ID of the list in the external source.
        integration:
          type: string
          description: Integration the list is synchronised from.
        lastSynced:
          type: string
          description: When the list was last synchronised.
      description: External source the list is synchronised from.
    ContactFilter:
      type: object
      properties:
        q:
          type: string
          description: Search term that contacts must match.
        attributes:
          type: array
          description: Attribute conditions that contacts must meet.
          items:
            $ref: "#/components/schemas/Condition"
        list:
          type: string
          description: ID of a list that contacts must belong to.
        valid:
          type: boolean
          description: Whether to include only valid contacts.
        invalid:
          type: boolean
          description: Whether to include only invalid contacts.
        blocked:
          type: boolean
          description: Whether to include only blocked contacts.
        unblocked:
          type: boolean
          description: Whether to include only unblocked contacts.
        optIn:
          type: boolean
          description: Whether to include only contacts that have opted in.
      description: "Criteria that select contacts, used to define the members of a\
        \ list."
    ToolsSharefileBody:
      type: object
      properties:
        media:
          type: string
          format: binary
    AvailablePhoneNumber:
      type: object
      properties:
        country:
          type: string
          description: Country of the phone number.
        number:
          type: string
          description: The available phone number.
        price:
          type: string
          description: Price of the phone number.
        type:
          type: string
          description: Type of the phone number.
        features:
          type: array
          description: Features supported by the phone number.
          items:
            type: string
      description: A phone number that is available to be added to the account.
    Person:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier of the person.
          readOnly: true
        email:
          type: string
          description: Email address of the person.
          example: chris@sakari.io
        firstName:
          type: string
          description: First name of the person.
          example: Chris
        lastName:
          type: string
          description: Last name of the person.
          example: Bloggs
        mobile:
          $ref: "#/components/schemas/InternationalNumber"
      description: "Basic details of a person, such as a contact or a user."
    ListNodeConfig:
      type: object
      properties:
        contact:
          $ref: "#/components/schemas/WorkflowDataReference"
        list:
          $ref: "#/components/schemas/List"
      description: Configuration of a node that acts on a contact's membership of
        a list.
    Link:
      required:
      - destinationUrl
      - keyId
      - shortenedUrl
      type: object
      properties:
        id:
          type: string
          description: Unique identifier of the link.
          readOnly: true
        name:
          type: string
          description: Name of the link.
        keyId:
          type: string
          description: Key that identifies the link in its shortened URL.
          readOnly: true
        domain:
          $ref: "#/components/schemas/LinkDomain"
        destinationUrl:
          type: string
          description: URL the link redirects to.
        shortenedUrl:
          type: string
          description: Shortened URL of the link.
          readOnly: true
        contactTracking:
          type: boolean
          description: Whether clicks are tracked per contact.
        sourceTracking:
          type: boolean
          description: Whether clicks are tracked per source.
        stats:
          $ref: "#/components/schemas/LinkStats"
        created:
          $ref: "#/components/schemas/Updated"
        updated:
          $ref: "#/components/schemas/Updated"
      description: A tracked short link that records clicks on a destination URL.
    LinkResponse:
      required:
      - data
      description: Response containing a single tracked link.
      allOf:
      - $ref: "#/components/schemas/BasicResponse"
      - type: object
        properties:
          data:
            $ref: "#/components/schemas/Link"
    Group:
      description: "A group of phone numbers, senders and users that send and receive\
        \ messages together."
      allOf:
      - $ref: "#/components/schemas/BasicGroup"
      - type: object
        properties:
          id:
            type: string
            description: Unique identifier of the group.
          name:
            type: string
            description: Name of the group.
          phoneNumbers:
            type: array
            description: Phone numbers assigned to the group.
            items:
              $ref: "#/components/schemas/PhoneNumber"
          notifications:
            type: array
            description: Notification destinations configured for the group.
            items:
              $ref: "#/components/schemas/GroupNotification"
          tags:
            type: array
            description: Tags assigned to the group.
            items:
              type: string
          users:
            type: array
            description: Users who belong to the group.
            items:
              $ref: "#/components/schemas/User"
          senders:
            type: array
            description: Senders assigned to the group.
            items:
              $ref: "#/components/schemas/Sender"
          officeHours:
            $ref: "#/components/schemas/GroupOfficeHours"
          isDefault:
            type: boolean
            description: Whether this is the account's default group.
          useSharedPool:
            type: boolean
            description: Whether the group sends from the shared phone number pool.
    GoogleSheet:
      type: object
      properties:
        connection:
          $ref: "#/components/schemas/UserIntegration"
        id:
          type: string
          description: Unique identifier of the spreadsheet.
        name:
          type: string
          description: Name of the spreadsheet.
        tabs:
          type: array
          description: Tabs in the spreadsheet.
          items:
            $ref: "#/components/schemas/GoogleSheetTab"
        tab:
          $ref: "#/components/schemas/GoogleSheetTab"
      description: A Google Sheets spreadsheet used by a workflow node.
    TemplatesResponse:
      required:
      - data
      description: Paginated response containing a list of templates.
      allOf:
      - $ref: "#/components/schemas/PaginatedResponse"
      - type: object
        properties:
          data:
            type: array
            description: The templates in this page of results.
            items:
              $ref: "#/components/schemas/Template"
    MessagesResponse:
      required:
      - data
      description: Paginated response containing a list of messages.
      allOf:
      - $ref: "#/components/schemas/PaginatedResponse"
      - type: object
        properties:
          data:
            type: array
            description: The messages in this page of results.
            items:
              $ref: "#/components/schemas/Message"
    Conversation:
      required:
      - closed
      - lastMessage
      type: object
      properties:
        id:
          type: string
          description: Unique identifier of the conversation.
          readOnly: true
        contact:
          $ref: "#/components/schemas/Contact"
        closed:
          type: string
          description: Date and time the conversation was closed.
          format: date-time
          readOnly: true
        lastMessage:
          $ref: "#/components/schemas/Message"
        phoneNumber:
          $ref: "#/components/schemas/PhoneNumber"
        group:
          $ref: "#/components/schemas/BasicGroup"
        unread:
          type: array
          description: Identifiers that track unread messages in the conversation.
          items:
            type: string
        type:
          type: string
          description: Type of the conversation.
        created:
          $ref: "#/components/schemas/Updated"
        updated:
          $ref: "#/components/schemas/Updated"
      description: A message thread between the account and a single contact.
    WorkflowNodeProperty:
      description: A configurable property of a workflow node type.
      allOf:
      - $ref: "#/components/schemas/WorkflowNodePropertyBaseObject"
      - required:
        - name
        type: object
        properties:
          name:
            type: string
            description: Name of the property.
          conditions:
            type: array
            description: Conditions that control when the property applies.
            items:
              $ref: "#/components/schemas/WorkflowNodePropertyCondition"
    WorkflowNode:
      required:
      - config
      - id
