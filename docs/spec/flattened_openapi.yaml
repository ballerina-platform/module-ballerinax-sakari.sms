          readOnly: true
        supportLink:
          type: string
          description: URL of support documentation for the node type.
          readOnly: true
      description: A type of node that can be used in a workflow.
    WorkflowDefinition:
      required:
      - edges
      - nodes
      type: object
      properties:
        nodes:
          type: array
          description: Nodes in the workflow.
          items:
            $ref: "#/components/schemas/WorkflowNode"
        edges:
          type: array
          description: Edges connecting the workflow nodes.
          items:
            $ref: "#/components/schemas/WorkflowEdge"
        properties:
          $ref: "#/components/schemas/WorkflowProperties"
      description: "The nodes, edges and properties that define a workflow version."
    AdvancedDelay:
      type: object
      properties:
        initialDelay:
          $ref: "#/components/schemas/Delay"
        additionalTime:
          $ref: "#/components/schemas/AdvancedDelayAdditionalTime"
      description: A delay with an initial duration and optional constraints on the
        days and time it ends.
    AvailablePhoneNumbersResponse:
      description: Response containing the phone numbers available to add to the account.
      allOf:
      - $ref: "#/components/schemas/BasicResponse"
      - required:
        - data
        type: object
        properties:
          data:
            type: array
            description: The available phone numbers.
            items:
              $ref: "#/components/schemas/AvailablePhoneNumber"
    SendMessagesRequestMedia:
      type: object
      properties:
        url:
          type: string
          description: URL of the media file.
    CampaignRequest:
      type: object
      properties:
        trigger:
          $ref: "#/components/schemas/CampaignRequestTrigger"
        filters:
          $ref: "#/components/schemas/CampaignRequestFilters"
        template:
          type: string
          description: Message template sent by the campaign.
      description: Request payload for creating a campaign.
    IncrDecrementNodeConfig:
      required:
      - property
      - value
      type: object
      properties:
        operation:
          type: string
          description: Whether to add to or subtract from the property.
          enum:
          - add
          - subtract
        property:
          type: string
          description: Name of the property to change.
        value:
          type: number
          description: Amount to add or subtract.
      description: Configuration of a node that increments or decrements a numeric
        property.
    LinkSourceStatsResponse:
      required:
      - data
      description: Paginated response containing click statistics over time for a
        link source.
      allOf:
      - $ref: "#/components/schemas/PaginatedResponse"
      - type: object
        properties:
          data:
            type: array
            description: Click counts by date for the link source.
            items:
              $ref: "#/components/schemas/LinkSourceStat"
    Campaign:
      required:
      - id
      - name
      type: object
      properties:
        id:
          type: string
          description: Unique identifier of the campaign.
          readOnly: true
        name:
          type: string
          description: Name of the campaign.
        description:
          type: string
          description: Description of the campaign.
        fieldMappings:
          type: array
          description: Mappings from uploaded file columns to contact attributes.
          items:
            $ref: "#/components/schemas/FieldMapping"
        filters:
          $ref: "#/components/schemas/CampaignFilter"
        media:
          type: array
          description: List of media objects attached to message
          items:
            $ref: "#/components/schemas/Media"
        phoneNumberFilter:
          $ref: "#/components/schemas/CampaignPhoneNumberFilter"
        schedule:
          $ref: "#/components/schemas/Schedule"
        nextExecution:
          type: string
          description: When the campaign is next due to run.
        reporting:
          $ref: "#/components/schemas/CampaignReporting"
        template:
          type: string
          description: Message template sent by the campaign.
        trigger:
          $ref: "#/components/schemas/CampaignTrigger"
        created:
          $ref: "#/components/schemas/Updated"
        updated:
          $ref: "#/components/schemas/Updated"
        paused:
          type: string
          description: When the campaign was paused.
        lastJob:
          $ref: "#/components/schemas/CampaignExecution"
      description: "A reusable message campaign with its contact filters, template,\
        \ schedule and reporting settings."
    ListTriggerConfig:
      type: object
      properties:
        list:
          $ref: "#/components/schemas/List"
      description: Configuration of a trigger that starts a workflow based on membership
        of a contact list.
    CampaignRequestTrigger:
      type: object
      properties:
        code:
          type: string
          description: |
            Campaign type specifies how it sources contacts and what event triggers its execution  Sort order
              * `M` - Manual
              * `S` - Scheduled
              * `FU` - File Upload
              * `V2` - V2
          enum:
          - M
          - S
          - FU
          - V2
      description: How the campaign is triggered.
    DripCampaignTrigger:
      required:
      - delay
      - type
      type: object
      properties:
        type:
          type: string
          description: Type of the trigger event.
        message:
          type: string
          description: Message text that triggers the drip campaign when received.
        groups:
          type: array
          description: Groups whose events trigger the drip campaign.
          items:
            $ref: "#/components/schemas/Group"
        list:
          $ref: "#/components/schemas/List"
        group:
          $ref: "#/components/schemas/Group"
        delay:
          $ref: "#/components/schemas/Delay"
      description: Event that enrols contacts in the drip campaign.
    SmsRegulatory:
      type: object
      properties:
        brandStatus:
          type: string
          description: Registration status of the brand.
        campaign:
          $ref: "#/components/schemas/SmsRegulatoryCampaign"
        pft:
          type: boolean
          description: PFT flag of the SMS registration.
        submitted:
          type: string
          description: Date and time the registration was submitted.
          format: date-time
        approved:
          type: string
          description: Date and time the registration was approved.
          format: date-time
        rejected:
          type: string
          description: Date and time the registration was rejected.
          format: date-time
      description: Carrier registration details for sending SMS from a phone number.
    CampaignRequestFilters:
      type: object
      properties:
        contacts:
          type: array
          description: Contacts to include in the campaign.
          items:
            type: string
        tags:
          type: array
          description: Tags that contacts must have to be included.
          items:
            type: string
        attributes:
          type: array
          description: Attribute conditions that contacts must meet to be included.
          items:
            type: string
      description: Criteria that select the contacts the campaign is sent to.
    GoogleSheetsExportNodeConfig:
      type: object
      properties:
        googlesheet:
          $ref: "#/components/schemas/GoogleSheet"
        properties:
          type: array
          description: Values to write to each column.
          items:
            $ref: "#/components/schemas/GoogleSheetColumnMapping"
        userId:
          type: string
          description: ID of the user whose integration is used.
      description: Configuration of a node that writes values to a Google Sheets spreadsheet.
    GroupNotification:
      type: object
      properties:
        destination:
          $ref: "#/components/schemas/GroupNotificationDestination"
        integration:
          type: string
          description: Integration used to deliver the notification.
        group:
          $ref: "#/components/schemas/BasicGroup"
      description: A notification destination configured for a group.
    User:
      required:
      - email
      - id
      - role
      description: A user of the Sakari account.
      allOf:
      - $ref: "#/components/schemas/Person"
      - type: object
        properties:
          role:
            type: string
            description: Role of the user in the account.
            enum:
            - Administrator
            - CampaignManager
            - Sender
            - ReadOnly
          tacAccepted:
            type: string
            description: Date and time the user accepted the terms and conditions.
            format: date-time
    Message:
      required:
      - created
      - id
      - status
      type: object
      properties:
        id:
          type: string
          description: Unique identifier of the message.
          readOnly: true
        contact:
          $ref: "#/components/schemas/Contact"
        conversation:
          $ref: "#/components/schemas/Conversation"
        group:
          $ref: "#/components/schemas/Group"
        type:
          type: string
          description: "Type of the message, such as SMS or MMS."
        message:
          type: string
          description: Text of the message.
        template:
          type: string
          description: Template used to generate the message.
        outgoing:
          type: boolean
          description: Whether the message was sent by the account rather than received.
        phoneNumber:
          type: string
          description: Account phone number used for the message.
          example: "+1234567890"
        price:
          type: number
          description: Price charged for the message.
        segments:
          type: number
          description: Number of segments the message was split into.
        read:
          type: boolean
          description: Whether the message has been read.
        status:
          type: string
          description: Delivery status of the message.
        media:
          type: array
          description: List of media objects attached to message
          items:
            $ref: "#/components/schemas/Media"
        sendAt:
          type: string
          description: Date and time the message is scheduled to be sent.
          format: date-time
        error:
          $ref: "#/components/schemas/Error"
        created:
          $ref: "#/components/schemas/Updated"
        updated:
          $ref: "#/components/schemas/Updated"
      description: An SMS or MMS message sent to or received from a contact.
    Hours:
      required:
      - end
      - start
      type: object
      properties:
        start:
          $ref: "#/components/schemas/Time"
        end:
          $ref: "#/components/schemas/Time"
      description: "A time range within a day, with a start and an end time."
    Form:
      required:
      - conversions
      - id
      - impressions
      - name
      type: object
      properties:
        id:
          type: string
          description: Unique identifier of the form.
          readOnly: true
        name:
          type: string
          description: Name of the form.
        active:
          type: string
          description: Date and time the form was activated.
          format: date-time
          readOnly: true
        impressions:
          type: number
          description: Number of times the form was viewed.
          readOnly: true
        conversions:
          type: number
          description: Number of times the form was submitted.
          readOnly: true
        created:
          $ref: "#/components/schemas/Updated"
        updated:
          $ref: "#/components/schemas/Updated"
      description: A web form that collects contact sign-ups.
    DripCampaignExecutionsResponse:
      description: Response containing drip campaign executions.
      allOf:
      - $ref: "#/components/schemas/BasicResponse"
      - required:
        - data
        type: object
        properties:
          data:
            type: array
            description: The drip campaign executions.
            items:
              $ref: "#/components/schemas/DripCampaignExecution"
    ListDoubleOptIn:
      type: object
      properties:
        enabled:
          type: boolean
          description: Whether double opt-in is required to join the list.
        prompt:
          type: string
          description: Message asking the contact to confirm the opt-in.
      description: Double opt-in settings for the list.
    FieldMapping:
      type: object
      properties:
        attribute:
          type: string
          description: Contact attribute the column maps to.
        column:
          type: string
          description: Column in the uploaded file.
        mandatory:
          type: boolean
          description: Whether the column must have a value.
      description: Maps a column of an uploaded file to a contact attribute.
    Time:
      required:
      - hour
      - minute
      type: object
      properties:
        hour:
          type: number
          description: Hour of the day.
        minute:
          type: number
          description: Minute of the hour.
      description: A time of day expressed as an hour and minute.
    SendMessagesRequestPhoneNumberFilter:
      type: object
      properties:
        group:
          $ref: "#/components/schemas/SendMessagesRequestPhoneNumberFilterGroup"
      description: Selects the phone numbers the message is sent from.
    SendMessageNodeConfig:
      type: object
      properties:
        from:
          $ref: "#/components/schemas/SendMessageNodeConfigFrom"
        to:
          $ref: "#/components/schemas/SendMessageNodeConfigTo"
        message:
          $ref: "#/components/schemas/SendMessageNodeConfigMessage"
      description: Configuration of a node that sends a message.
    AdvancedDelayAdditionalTime:
      type: object
      properties:
        timezone:
          type: string
          description: Time zone used for the day and time constraints.
        days:
          $ref: "#/components/schemas/AdvancedDelayDays"
        time:
          $ref: "#/components/schemas/AdvancedDelayTime"
      description: Constraints on the days and time at which the delay ends.
    MessageStatusTriggerConfig:
      type: object
      properties:
        status:
          type: string
          description: Message status that triggers the workflow.
          enum:
          - sent
          - error
        errors:
          type: array
          description: Message errors that trigger the workflow.
          items:
            $ref: "#/components/schemas/Error"
      description: Configuration of a trigger that starts a workflow when a message
        reaches a given status.
    SmsRegulatoryCampaign:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier of the registered campaign.
        campaignId:
          type: string
          description: Campaign ID assigned by the registry.
        useCase:
          type: string
          description: Use case of the registered campaign.
      description: Registered messaging campaign.
    SendMessageToType:
      type: string
      description: Type of recipient a workflow message is sent to.
      enum:
      - contact
      - custom
      - group
      - user
    SmsChannel:
      description: SMS channel settings for a phone number or sender.
      allOf:
      - $ref: "#/components/schemas/Channel"
      - type: object
        properties:
          universalReply:
            type: boolean
            description: Whether universal reply is enabled for the SMS channel.
          supportedDestinations:
            $ref: "#/components/schemas/SupportedDestinations"
          regulatory:
            $ref: "#/components/schemas/SmsRegulatory"
    WorkflowEdgeType:
      type: string
      description: Type of an edge connecting two workflow nodes.
      enum:
      - standard
      - timeout
      - error
    SelectOption:
      type: object
      properties:
        value:
          type: string
          description: Value of the option.
        label:
          type: string
          description: Display label of the option.
      description: An option offered for a selectable workflow node property.
    EdgeValidation:
      type: object
      properties:
        type:
          type: string
          description: Type of the edge.
          enum:
          - timeout
          - standard
          - error
        value:
          $ref: "#/components/schemas/EdgeValidationValue"
        multiple:
          type: boolean
          description: Whether multiple edges of this type are allowed.
        defaultEdge:
          type: boolean
          description: Whether this is the default edge.
      description: Rules for an outgoing edge of a workflow node type.
    QuickCampaignRequestMessage:
      type: object
      properties:
        message:
          type: string
          description: Text of the message.
        media:
          type: array
          description: Media files attached to the message.
          items:
            $ref: "#/components/schemas/Media"
      description: Message content sent by the campaign.
    AccountBalance:
      required:
      - balance
      - country
      - segments
      type: object
      properties:
        balance:
          type: number
          description: Current account balance.
          format: double
        country:
          type: string
          description: Country used to price message segments.
        segments:
          type: number
          description: Number of message segments the current balance can pay for.
        segmentPrice:
          type: number
          description: Price of a single message segment.
      description: The current balance of a Sakari account and the message segments
        it can pay for.
    ConversationResponse:
      required:
      - data
      description: Response containing a single conversation.
      allOf:
      - $ref: "#/components/schemas/BasicResponse"
      - type: object
        properties:
          data:
            $ref: "#/components/schemas/Conversation"
    LinkSourceStat:
      required:
      - date
      - value
      type: object
      properties:
        date:
          type: string
          description: Date the statistic applies to.
          format: date-time
        value:
          type: number
          description: Number of clicks on that date.
      description: Click count for a tracked link source on a given date.
    WorkflowNodeTypeValidation:
      type: object
      properties:
        numEdgeCondition:
          $ref: "#/components/schemas/NumEdgeConditions"
        numEdges:
          type: number
          description: Required number of edges.
        edges:
          type: array
          description: Rules for each outgoing edge.
          items:
            $ref: "#/components/schemas/EdgeValidation"
      description: Rules for the outgoing edges a workflow node type must have.
      readOnly: true
    GoogleSheetsLookupNodeConfig:
      type: object
      properties:
        googlesheet:
          $ref: "#/components/schemas/GoogleSheet"
        searchColumn:
          $ref: "#/components/schemas/GoogleSheetColumn"
        outputColumn:
          $ref: "#/components/schemas/GoogleSheetColumn"
        searchValue:
          type: string
          description: Value to search for.
        userId:
          type: string
          description: ID of the user whose integration is used.
      description: Configuration of a node that looks up a value in a Google Sheets
        spreadsheet.
    Condition:
      required:
      - attribute
      - comparator
      - value
      type: object
      properties:
        attribute:
          type: string
          description: Contact attribute to compare.
        comparator:
          type: string
          description: Comparison operator to apply.
        value:
          description: Value or values to compare the attribute against.
          oneOf:
          - type: array
            items:
              type: string
          - type: array
            items:
              type: number
          - type: string
          - type: number
      description: A comparison applied to a contact attribute to filter contacts.
    DayOfWeek:
      type: number
      description: "Day of the week, from 0 for Sunday to 6 for Saturday."
      enum:
      - 0
      - 1
      - 2
      - 3
      - 4
      - 5
      - 6
    SendMessageNodeConfigTo:
      type: object
      properties:
        type:
          $ref: "#/components/schemas/SendMessageToType"
        mobile:
          $ref: "#/components/schemas/InternationalNumber"
        group:
          $ref: "#/components/schemas/Group"
        user:
          $ref: "#/components/schemas/User"
        contact:
          $ref: "#/components/schemas/WorkflowDataReference"
      description: Recipient of the message.
    CreateContactResponse:
      description: "The created contacts, or a summary of the uploaded contacts."
      oneOf:
      - $ref: "#/components/schemas/ContactsResponse"
      - $ref: "#/components/schemas/ContactUploadResponse"
    WhatsappChannel:
      description: WhatsApp channel settings for a phone number or sender.
      allOf:
      - $ref: "#/components/schemas/Channel"
    WorkflowNodePropertyCondition:
      required:
      - comparator
      - property
      - value
      type: object
      properties:
        property:
          type: string
          description: Name of the property to check.
        comparator:
          type: string
          description: Comparison operator to apply.
        value:
          type: string
          description: Value to compare against.
      description: A condition on another property that controls when a workflow node
        property applies.
    ShareFileResponse:
      description: Response containing the short link to a shared file.
      allOf:
      - $ref: "#/components/schemas/BasicResponse"
      - required:
        - data
        type: object
        properties:
          data:
            required:
            - link
            type: object
            properties:
              link:
                type: string
                description: Short link to the shared file.
              expires:
                type: string
                description: Date and time the link expires.
                format: date-time
            description: Details of the shared file.
    Error:
      required:
      - code
      - description
      type: object
      properties:
        code:
          type: string
          description: Code identifying the error.
          example: CONT-010
        description:
          type: string
          description: Human-readable description of the error.
          example: Contact has requested no further communication
      description: "An error reported by the API, with a code and a human-readable\
        \ description."
    FormSubmittedTriggerConfig:
      type: object
      properties:
        form:
          $ref: "#/components/schemas/Form"
      description: Configuration of a trigger that starts a workflow when a form is
        submitted.
    ConversationsResponse:
      required:
      - data
      description: Paginated response containing a list of conversations.
      allOf:
      - $ref: "#/components/schemas/PaginatedResponse"
      - type: object
        properties:
          data:
            type: array
            description: The conversations in this page of results.
            items:
              $ref: "#/components/schemas/Conversation"
    Contact:
      required:
      - id
      description: A contact in the Sakari address book.
      allOf:
      - $ref: "#/components/schemas/Person"
      - type: object
        properties:
          lists:
            type: array
            description: Lists the contact belongs to.
            items:
              $ref: "#/components/schemas/ContactList"
          attributes:
            type: object
            description: Custom attributes of the contact.
          optIn:
            type: string
            description: Date and time the contact opted in to messages.
            format: date-time
          blocked:
            type: string
            description: Date and time the contact was blocked.
            format: date-time
          activecampaign:
            type: object
            properties:
              id:
                type: number
                description: ID of the contact in ActiveCampaign.
            description: Link to the matching ActiveCampaign record.
          hubspot:
            type: object
            properties:
              id:
                type: number
                description: ID of the contact in HubSpot.
            description: Link to the matching HubSpot record.
          pipedrive:
            type: object
            properties:
              id:
                type: number
                description: ID of the contact in Pipedrive.
            description: Link to the matching Pipedrive record.
          valid:
            type: boolean
            description: Whether the contact's details are valid.
            readOnly: true
          error:
            $ref: "#/components/schemas/Error"
          created:
            $ref: "#/components/schemas/Updated"
          updated:
            $ref: "#/components/schemas/Updated"
    QuickCampaignRequest:
      required:
      - groupId
      - listId
      - message
      - name
      type: object
      properties:
        name:
          type: string
          description: Name of the campaign.
        groupId:
          type: string
          description: ID of the group that sends the campaign messages.
        listId:
          type: string
          description: ID of the contact list the campaign is sent to.
        message:
          $ref: "#/components/schemas/QuickCampaignRequestMessage"
        sendAt:
          type: string
          description: Date and time at which to send the campaign.
          format: date-time
      description: Request payload for creating a campaign and executing it immediately
        or at a scheduled time.
    MessageReceivedTriggerConfig:
      type: object
      properties:
        message:
          type: string
          description: Message text that triggers the workflow.
        groups:
          type: array
          description: Groups whose received messages trigger the workflow.
          items:
            $ref: "#/components/schemas/Group"
      description: Configuration of a trigger that starts a workflow when a message
        is received.
    LinksResponse:
      required:
      - data
      description: Paginated response containing a list of tracked links.
      allOf:
      - $ref: "#/components/schemas/PaginatedResponse"
      - type: object
        properties:
          data:
            type: array
            description: The tracked links in this page of results.
            items:
              $ref: "#/components/schemas/Link"
    CampaignFilter:
      type: object
      properties:
        list:
          description: "Contact list to send to, either as a list object or a list\
            \ ID."
          oneOf:
          - $ref: "#/components/schemas/List"
          - type: string
        q:
          type: string
          description: Search term that contacts must match.
        attributes:
          type: array
          description: Attribute conditions that contacts must meet.
          items:
            $ref: "#/components/schemas/Condition"
        tags:
          type: array
          description: Tags used to select contacts.
          items:
            $ref: "#/components/schemas/CampaignFilterTags"
      description: Criteria that select which contacts a campaign is sent to.
    WorkflowEdge:
      required:
      - id
      - source
      - type
      type: object
      properties:
        id:
          type: string
          description: Unique identifier of the edge.
        type:
          $ref: "#/components/schemas/WorkflowEdgeType"
        source:
          type: string
          description: ID of the node the edge starts from.
        target:
          type: string
          description: ID of the node the edge leads to.
        value:
          description: Value the source node must produce for the edge to be followed.
          anyOf:
          - type: string
          - type: boolean
          - type: number
      description: A connection from one workflow node to another.
    GoogleSheetColumnMapping:
      type: object
      properties:
        column:
          $ref: "#/components/schemas/GoogleSheetColumn"
        value:
          type: string
          description: Value written to the column.
      description: Maps a value to a column in a Google Sheets tab.
    Times:
      type: object
      properties:
        sun:
          type: array
          description: Time ranges on Sunday.
          items:
            $ref: "#/components/schemas/Hours"
        mon:
          type: array
          description: Time ranges on Monday.
          items:
            $ref: "#/components/schemas/Hours"
        tue:
          type: array
          description: Time ranges on Tuesday.
          items:
            $ref: "#/components/schemas/Hours"
        wed:
          type: array
          description: Time ranges on Wednesday.
          items:
            $ref: "#/components/schemas/Hours"
        thu:
          type: array
          description: Time ranges on Thursday.
          items:
            $ref: "#/components/schemas/Hours"
        fri:
          type: array
          description: Time ranges on Friday.
          items:
            $ref: "#/components/schemas/Hours"
        sat:
          type: array
          description: Time ranges on Saturday.
          items:
            $ref: "#/components/schemas/Hours"
      description: "Weekly schedule of time ranges, listed per day of the week."
    Schedule:
      required:
      - frequency
      type: object
      properties:
        frequency:
          type: string
          description: Code for how often the campaign runs.
          enum:
          - OD
          - O
          - D
          - M
        timezone:
          type: string
